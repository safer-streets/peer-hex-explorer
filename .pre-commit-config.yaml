repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.21
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.84
    hooks:
      - id: ty
  # The fourth quality gate (see AGENTS.md). Not a hosted hook: it has to run in
  # this project's own environment to import beahiv. The suite is well under a
  # second, so there's nothing to be gained by deferring it to pre-push, and
  # always_run (rather than types: [python]) keeps it honest for the commits
  # most likely to break it silently -- a pyproject.toml dependency bump.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        always_run: true
        pass_filenames: false
